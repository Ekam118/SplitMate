{% extends "dashboard_base.html" %}

{% block title %}
Create Group | SplitMate
{% endblock %}

{% block groups_active %}
active
{% endblock %}

{% block page_content %}

<div class="d-flex justify-content-between align-items-center mb-4">

    <div>

        <h2 class="fw-bold mb-1">
            Create Group
        </h2>

        <p>
            Create a new expense sharing group.
        </p>

    </div>

</div>

<div class="card border-0 shadow rounded-4">

    <div class="card-body p-4">

        <form method="POST">

            <div class="mb-3">

                <label class="form-label">
                    Group Name
                </label>

                <input
                    type="text"
                    name="name"
                    class="form-control"
                    placeholder="Enter group name"
                    required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Description
                </label>

                <textarea
                    name="description"
                    class="form-control"
                    rows="4"
                    placeholder="Enter description"></textarea>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Group Type
                </label>

                <select
                    name="group_type"
                    class="form-select">

                    <option value="Friends">Friends</option>
                    <option value="Family">Family</option>
                    <option value="Trip">Trip</option>
                    <option value="Office">Office</option>
                    <option value="Other">Other</option>

                </select>

            </div>

            <div class="form-check mb-3">

                <input
                    class="form-check-input"
                    type="checkbox"
                    id="trip_mode"
                    name="trip_mode">

                <label
                    class="form-check-label"
                    for="trip_mode">

                    Enable Trip Mode

                </label>

            </div>

            <div class="row">

                <div class="col-md-6">

                    <div class="mb-3">

                        <label class="form-label">
                            Trip Start Date
                        </label>

                        <input
                            type="date"
                            name="trip_start_date"
                            class="form-control">

                    </div>

                </div>

                <div class="col-md-6">

                    <div class="mb-3">

                        <label class="form-label">
                            Trip End Date
                        </label>

                        <input
                            type="date"
                            name="trip_end_date"
                            class="form-control">

                    </div>

                </div>

            </div>

            <div class="mt-4">

                <button
                    type="submit"
                    class="btn btn-primary">

                    <i class="bi bi-check-circle-fill"></i>

                    Create Group

                </button>

                <a
                    href="{{ url_for('groups.groups_home') }}"
                    class="btn btn-secondary">

                    Cancel

                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
