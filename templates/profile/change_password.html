{% extends "dashboard_base.html" %}


{% block title %}
Change Password | SplitMate
{% endblock %}



{% block page_content %}


<div class="card shadow border-0 rounded-4">


<div class="card-body">


<h3 class="fw-bold mb-4">
    Change Password
</h3>



<form method="POST">


<div class="mb-3">

<label class="form-label">
Current Password
</label>

<input type="password"
name="current_password"
class="form-control"
required>

</div>



<div class="mb-3">

<label class="form-label">
New Password
</label>

<input type="password"
name="new_password"
class="form-control"
required>

</div>



<div class="mb-3">

<label class="form-label">
Confirm New Password
</label>

<input type="password"
name="confirm_password"
class="form-control"
required>

</div>



<button class="btn btn-success">

<i class="bi bi-key"></i>

Change Password

</button>


<a href="{{ url_for('profile.profile_home') }}"
class="btn btn-secondary">

Cancel

</a>



</form>


</div>


</div>


{% endblock %}
