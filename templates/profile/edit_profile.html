{% extends "dashboard_base.html" %}


{% block title %}
Edit Profile | SplitMate
{% endblock %}



{% block page_content %}


<div class="card shadow border-0 rounded-4">


<div class="card-body">


<h3 class="fw-bold mb-4">
    Edit Profile
</h3>


<form method="POST"
      enctype="multipart/form-data">


<div class="mb-3">

<label class="form-label">
    Full Name
</label>

<input type="text"
class="form-control"
name="fullname"
value="{{ user.fullname }}"
required>

</div>



<div class="mb-3">

<label class="form-label">
    Email
</label>

<input type="email"
class="form-control"
name="email"
value="{{ user.email }}"
required>

</div>



<div class="mb-3">

<label class="form-label">
    Profile Image
</label>

<input type="file"
class="form-control"
name="profile_image">

</div>



<button class="btn btn-success">

    Save Changes

</button>


<a href="{{ url_for('profile.profile_home') }}"
class="btn btn-secondary">

    Cancel

</a>


</form>


</div>


</div>


{% endblock %}
